\Preamble{xhtml,html5,mathml,3,sec-filename,info,fn-in,fonts,nostyle}

% style with style.css
\Configure{AddCss}{css/style.css}

% crosslinks
\Configure{crosslinks+}
        {\TableOfContents\HCode{<nav class="topcrosslinks">\Hnewline}} % before top crosslinks - start topcrosslinks nav
        {\HCode{</nav>\Hnewline}}% after top crosslinks - end topcrosslinks nav
        {\HCode{</main>\Hnewline<nav class="bottomcrosslinks">\Hnewline}} % before bottom crosslinks - start bottomcrosslinks nav
        {\HCode{</nav>\Hnewline}} % after bottom crosslinks - close bottomcrosslinks nav

% toc
\Configure{tableofcontents}
        {\HCode{<nav class="toc">\Hnewline}} % before - start toc nav
        {} % end
        {\HCode{</nav>\Hnewline<main class="article">\Hnewline}} % after - close toc nav
        {} % before non-indented par
        {} % before indented par

\begin{document}
\EndPreamble
